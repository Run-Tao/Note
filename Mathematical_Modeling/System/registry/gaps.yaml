    retest_log:
      - date: 2026-11-28
        task_id: weekly-2026-W48-g-004
        result: verified
        finding: "自建退化实例（6 项背包，配对同价，cap=30 卡边界）得 4 个同价最优解（mask 7/11/19/35，两两 Hamming 2）；穷举 36 个可行解中，单解基准判分只放行 1 个 → **族内正确解漏放率 75%**；集合比对（参照=完整族）4/4 全放行；但**参照集只含一个解时，集合比对行为与单解基准完全相同（1/4）**；容差 1e-9/1e-6/1e-3 三档族大小恒为 4（结论不靠 eps）；辅助指标 weighted_sum 在族内 10.0→8.2 极差 1.8 = **平局被 tie-break 伪装成差异**；反例：容量 +7 → 族 5、破坏全部配对 → 族 1（首版只破坏一对时族仍 4，断言当场 FAIL）"
        new_issue: "① 『集合比对』的名字不等于能力：参照集不完整即退化为单解；② 仅覆盖可穷举规模（n=6），大 n 的多解枚举（no-good cut）未实现；③ 未回灌到 B1 评审脚本"
        action: "本 gap 的知识点（退化情形验证全族）已获首个可复现实证，但 **retest 未通过与 B2 无关**——它要求的是『优化类测试评分增加并列最优项』这一动作在评审脚本里落地，而评审脚本不在本仓库 → 保持 in_progress，due 仍为 2026-12-15"
        passed_rounds: 0
